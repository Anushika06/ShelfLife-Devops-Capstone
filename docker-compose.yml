# ShelfLife local stack: PostgreSQL + FastAPI backend + React/Nginx frontend.
#   docker compose up --build      -> UI at http://localhost:3000, API at http://localhost:8000
# Defaults below are for local development only. To change them, copy .env.example
# to .env (git-ignored) and edit it; Compose reads .env automatically.
name: shelflife

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shelflife}
      POSTGRES_USER: ${POSTGRES_USER:-shelflife}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shelflife-local-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      # Bound to localhost only; lets you run the backend outside Docker if you want.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      args:
        APP_VERSION: ${APP_VERSION:-local}
    image: shelflife-backend:local
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-shelflife}
      DB_USER: ${POSTGRES_USER:-shelflife}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-shelflife-local-only}
      ENVIRONMENT: docker-compose
      EXPIRY_WARNING_DAYS: ${EXPIRY_WARNING_DAYS:-3}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Kolkata}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        APP_VERSION: ${APP_VERSION:-local}
    image: shelflife-frontend:local
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:8080"
    restart: unless-stopped

volumes:
  postgres-data:
