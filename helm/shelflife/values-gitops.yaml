# Release managed by Argo CD (argocd/application.yaml) in namespace "shelflife-gitops".
# The image block below is rewritten by the CI "gitops-promote" job after every
# successful build on main: that commit is what Argo CD syncs (Git = desired state).
backend:
  image:
    repository: ghcr.io/anushika06/shelflife-backend
    tag: 4d6d703165664c32f22180e06e1f0253c49c98b8
  config:
    environment: gitops
frontend:
  image:
    repository: ghcr.io/anushika06/shelflife-frontend
    tag: 4d6d703165664c32f22180e06e1f0253c49c98b8
ingress:
  host: shelflife-gitops.localtest.me
metrics:
  grafanaDashboard:
    enabled: false # the Helm CLI release already ships the dashboard
tests:
  enabled: false
