{{- $fullname := include "shelflife.fullname" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-backend
  labels:
    {{- include "shelflife.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
data:
  DB_HOST: {{ printf "%s-postgres" $fullname | quote }}
  DB_PORT: "5432"
  DB_NAME: {{ .Values.postgres.auth.database | quote }}
  ENVIRONMENT: {{ .Values.backend.config.environment | quote }}
  EXPIRY_WARNING_DAYS: {{ .Values.backend.config.expiryWarningDays | quote }}
  APP_TIMEZONE: {{ .Values.backend.config.timezone | quote }}
  # UI and API share one origin behind the Ingress, so no cross-origin access is needed.
  CORS_ORIGINS: ""
  DB_WAIT_SECONDS: "120"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-backend
  labels:
    {{- include "shelflife.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  {{- if not .Values.backend.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "shelflife.selectorLabels" (dict "ctx" . "component" "backend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "shelflife.labels" . | nindent 8 }}
        {{- include "shelflife.selectorLabels" (dict "ctx" . "component" "backend") | nindent 8 }}
      annotations:
        checksum/config: {{ .Values.backend.config | toJson | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: {{ include "shelflife.image" (dict "component" "backend" "image" .Values.backend.image) }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: {{ $fullname }}-backend
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "shelflife.postgresSecretName" . }}
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "shelflife.postgresSecretName" . }}
                  key: password
          # Startup covers "wait for PostgreSQL + run Alembic migrations".
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext:
            {{- include "shelflife.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-backend
  labels:
    {{- include "shelflife.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    {{- include "shelflife.selectorLabels" (dict "ctx" . "component" "backend") | nindent 4 }}
  ports:
    - name: http
      port: 8000
      targetPort: http
